<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1330"/>
      <stop offset="1" stop-color="#03060F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1FB8FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1FB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22E6FF"/>
      <stop offset="0.55" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19F0A8"/>
      <stop offset="1" stop-color="#C6FF5A"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22E6FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="4" y="4" width="504" height="504" rx="112"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="256" cy="256" r="250" fill="url(#halo)"/>
    <!-- faint grid -->
    <g stroke="#2F7BFF" stroke-opacity="0.10" stroke-width="1">
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
    </g>
  </g>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#22E6FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Supply-chain traces (network leaving the hexagon) -->
  <g fill="none" stroke="#22E6FF" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 86V50"/>
    <path d="M403 171L436 152H466"/>
    <path d="M403 341L436 360H466"/>
    <path d="M256 426V462"/>
    <path d="M109 341L76 360H46"/>
    <path d="M109 171L76 152H46"/>
  </g>
  <g fill="#03060F" stroke="#22E6FF" stroke-width="3" filter="url(#glowS)">
    <circle cx="256" cy="46" r="7"/>
    <circle cx="470" cy="152" r="7"/>
    <circle cx="470" cy="360" r="7"/>
    <circle cx="256" cy="466" r="7"/>
    <circle cx="42" cy="360" r="7"/>
    <circle cx="42" cy="152" r="7"/>
  </g>

  <!-- Hexagon (a node / a pallet cube seen from above) -->
  <polygon points="256,86 403,171 403,341 256,426 109,341 109,171"
           fill="#050B1E" fill-opacity="0.78" stroke="url(#hex)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,112 380,184 380,328 256,400 132,328 132,184"
           fill="none" stroke="#22E6FF" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>
  <!-- hexagon vertex nodes -->
  <g fill="#E8FBFF">
    <circle cx="256" cy="86" r="8"/><circle cx="403" cy="171" r="8"/><circle cx="403" cy="341" r="8"/>
    <circle cx="256" cy="426" r="8"/><circle cx="109" cy="341" r="8"/><circle cx="109" cy="171" r="8"/>
  </g>

  <!-- Invoice -->
  <path d="M192 170H268L304 206V314a10 10 0 0 1-10 10H192a10 10 0 0 1-10-10V180a10 10 0 0 1 10-10Z"
        fill="url(#doc)" stroke="#22E6FF" stroke-width="5" stroke-linejoin="round"/>
  <path d="M268 170V196a10 10 0 0 0 10 10H304" fill="none" stroke="#22E6FF" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#7DEBFF" stroke-width="7" stroke-linecap="round">
    <path d="M204 226H258"/>
    <path d="M204 250H238"/>
    <path d="M204 274H226"/>
  </g>

  <!-- Validation check -->
  <path d="M232 284L262 314L338 232" fill="none" stroke="url(#check)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
